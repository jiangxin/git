# Agent Configuration
# This is the merged configuration from:
# - User home directory: ~/.git-po-helper.yaml (lower priority)
# - Repository root: <repo-root>/git-po-helper.yaml (higher priority)

default_lang_code: zh_CN
prompt:
    update_pot: 
    update_po: 
    translate: 
    review_since: 
    review_commit:
    review:
agent-test:
    runs: 1
    pot_entries_before_update: 0
    pot_entries_after_update: 6091
    po_entries_before_update: 6083
    po_entries_after_update: 6091
    po_new_entries_after_update: 3
    po_fuzzy_entries_after_update: 7
agents:
    claude-glm:
        cmd:
            - claude
            - --dangerously-skip-permissions
            - --settings
            - /Users/jiangxin/.claude/settings-aliyun-i/settings.json-glm-5
            - -p
            - "{{.prompt}}"
        kind: claude
    claude-minimax:
